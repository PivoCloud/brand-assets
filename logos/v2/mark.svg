<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="PivoCloud">
  <!-- PivoCloud mark. Interlock design system (DESIGN-V2). Mark gradient #00FAFE to #0057DF. Same geometry as the pivocloud.com nav and favicon. -->
  <defs>
    <linearGradient id="pivo-mark-gradient" gradientUnits="userSpaceOnUse" x1="14" y1="50" x2="86" y2="50">
      <stop offset="0" stop-color="#00FAFE"/>
      <stop offset="1" stop-color="#0057DF"/>
    </linearGradient>
  </defs>
  <g transform="rotate(45 50 50)" fill="none" stroke="url(#pivo-mark-gradient)" stroke-width="12" stroke-linejoin="round">
    <path d="M22 78V22H56V50.5H42" stroke-linecap="butt"/>
    <circle cx="22" cy="78" r="6" fill="url(#pivo-mark-gradient)" stroke="none"/>
    <path d="M78 22V78H46" stroke-linecap="round"/>
  </g>
</svg>
